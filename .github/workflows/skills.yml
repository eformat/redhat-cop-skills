name: Skills CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills, index, evals + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate skills
        run: python scripts/validate_skills.py
      - name: Check README index freshness
        run: python scripts/generate_index.py --check
      - name: Validate eval suites
        run: python scripts/check_evals.py
      - name: Tooling tests
        run: python -m pytest tests/ -q

  install-smoke:
    name: Cross-harness install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install every skill into every harness, then assert
        run: |
          set -euo pipefail
          SCRATCH=$(mktemp -d)
          cd "$SCRATCH"
          echo "node: $(node --version) · npx: $(npx --version)"
          trap 'echo "--- scratch tree after failure ---"; find "$SCRATCH" -maxdepth 4 -not -path "*/node_modules*" | sort' ERR
          npx -y skills@1.8.1 add "$GITHUB_WORKSPACE" --skill '*' \
            -a claude-code -a codex -a cursor -a opencode -a pi \
            -a hermes-agent -a openclaw -a openhands -y --copy
          skills=$(ls "$GITHUB_WORKSPACE/skills")
          echo "Skills under test: $skills"
          fail=0
          # Oh My Pi and DeepSeek read .agents/skills too (shared dir), so they
          # are covered by the codex/cursor/opencode/pi targets.
          for d in .claude/skills .agents/skills .hermes/skills .openhands/skills skills; do
            for s in $skills; do
              if [ ! -f "$d/$s/SKILL.md" ]; then
                echo "::error::skill $s did not land in $d"
                fail=1
              fi
            done
          done
          echo "--- scratch tree ---"
          find "$SCRATCH" -maxdepth 3 -not -path "*/node_modules*" | sort
          exit $fail

  security:
    name: Secrets scan (gitleaks, pinned binary)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the GitHub release API
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan full history (fails the job on leaks)
        run: ./gitleaks detect --source . --redact --verbose
      # If redhat-cop ever adds an org GITLEAKS_LICENSE secret, this job can
      # swap back to the official action for PR-comment integration:
      #   - uses: gitleaks/gitleaks-action@v3
      #     env:
      #       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint (skillsaw, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # skillsaw: only ERRORS fail (repo .skillsaw.yaml sets fail-on: error);
      # warnings like the seed's token count are visible but never block.
      - name: skillsaw (skill prompt lint)
        uses: stbenjam/skillsaw@v0.22.0
      - name: ruff (python in skills/scripts/tests)
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --output-format github
      # NOTE: re-add shellcheck (e.g. ludeeus/action-shellcheck@2.0.0 — the
      # floating v2 tag no longer exists) when the repo gains .sh files.
      # Action refs are resolved at job setup even when `if:` skips the step,
      # so a dead ref here fails the whole job.
