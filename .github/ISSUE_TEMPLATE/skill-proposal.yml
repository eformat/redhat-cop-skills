name: Skill proposal
description: Propose a new skill for the Red Hat CoP skills repo
labels: ["skill-proposal", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What recurring task or pain does this skill solve? Who hits it?
    validations:
      required: true
  - type: textarea
    id: example-tasks
    attributes:
      label: Example tasks / trigger phrases
      description: What would a user say? e.g. "set up a local OpenShift AI sandbox", "draft release notes from this sprint"
    validations:
      required: true
  - type: textarea
    id: proposed-approach
    attributes:
      label: Proposed approach
      description: Rough workflow the skill would encode; MCP servers, CLIs or network access it needs.
    validations:
      required: true
  - type: input
    id: related-skills
    attributes:
      label: Related skills
      description: Existing skills (here or elsewhere) that overlap or could compose.
  - type: checkboxes
    id: authoring
    attributes:
      label: Authoring
      options:
        - label: I am willing to author this skill and shepherd the PR
        - label: I have checked the catalog for overlap
    validations:
      required: true
